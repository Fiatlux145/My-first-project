version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: neurofocus-db
    environment:
      POSTGRES_USER: neurofocus
      POSTGRES_PASSWORD: password
      POSTGRES_DB: neurofocus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurofocus"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurofocus-api
    environment:
      DATABASE_URL: postgresql+asyncpg://neurofocus:password@postgres:5432/neurofocus_db
      APP_NAME: "NeuroFocus MVP"
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
